name: CI/CD

# CD runs on the replacement VPS at 62.60.194.41. Its systemd timer pulls main
# only after this workflow's `test` check succeeds; no SSH credentials are kept
# in GitHub Actions secrets.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r deploy/requirements.txt pytest
          pip install --no-deps --no-build-isolation .
      - name: Run tests
        run: |
          set -o pipefail
          pytest -q --tb=long 2>&1 | tee pytest.out || {
            grep -E "Error|error:|FAILED|assert" pytest.out | tail -8 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | head -c 280)"
            done
            exit 1
          }
        env:
          MARKETMIND_ROOT: ${{ github.workspace }}
