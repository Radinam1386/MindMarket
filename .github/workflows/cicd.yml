name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r deploy/requirements.txt pytest
          pip install --no-deps --no-build-isolation .
      - name: Run tests
        run: |
          set -o pipefail
          pytest -q --tb=long 2>&1 | tee pytest.out || {
            grep -E "Error|error:|FAILED|assert" pytest.out | tail -8 | while IFS= read -r l; do
              echo "::error::$(echo "$l" | head -c 280)"
            done
            exit 1
          }
        env:
          MARKETMIND_ROOT: ${{ github.workspace }}

  # Instant push-deploy over SSH. Active only when the VPS_HOST and VPS_SSH_KEY
  # secrets are configured; otherwise the on-server pull timer
  # (marketmind-deploy.timer → deploy/vps-deploy.sh) deploys within ~5 minutes.
  deploy-vps:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        if: env.VPS_HOST != '' && env.VPS_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "root@$VPS_HOST" "/opt/marketmind/deploy/vps-deploy.sh --force"

      - name: Push deploy skipped (on-server timer is the fallback)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        if: env.VPS_HOST == '' || env.VPS_SSH_KEY == ''
        run: echo "VPS_HOST / VPS_SSH_KEY secrets not set — the server-side pull timer deploys within ~5 minutes of push. Add both secrets to enable instant SSH deploys."
