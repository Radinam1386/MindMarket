<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>داشبورد | MindMarket</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="rail" aria-label="ناوبری">
        <a class="rail-logo" href="/" title="صفحه اصلی" aria-label="صفحه اصلی"
          ><svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M3 23V9l7 8 6-10 6 10 7-8v14" /></svg
        ></a>
        <nav class="rail-nav">
          <a
            href="#/overview"
            data-route="overview"
            title="نمای حساب"
            aria-label="نمای حساب"
            ><svg viewBox="0 0 24 24">
              <path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z" /></svg
            ><span>حساب</span></a
          ><a
            href="#/markets"
            data-route="markets"
            title="بازارها"
            aria-label="بازارها"
            ><svg viewBox="0 0 24 24">
              <path d="M4 19V5m5 14V9m5 10V3m5 16v-7M2 21h20" /></svg
            ><span>بازار</span></a
          ><a
            href="#/research"
            data-route="research"
            title="پژوهش"
            aria-label="پژوهش"
            ><svg viewBox="0 0 24 24">
              <path d="M6 3h9l4 4v14H6zM15 3v5h4M9 12h7M9 16h7" /></svg
            ><span>پژوهش</span></a
          ><a
            href="#/logs"
            data-route="logs"
            title="رویدادها"
            aria-label="رویدادها"
            ><svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" /></svg
            ><span>رویداد</span></a
          ><a
            href="#/settings"
            data-route="settings"
            title="تنظیمات"
            aria-label="تنظیمات"
            ><svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
              /></svg
            ><span>تنظیمات</span></a
          >
        </nav>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <a class="wordmark" href="/">mind<span>market</span><i>.</i></a>
          <div class="top-center">
            <span class="paper-tag"><i></i> حساب آزمایشی</span
            ><span id="updated">در حال دریافت داده‌ها</span>
          </div>
          <div class="account-menu">
            <span id="username">—</span
            ><button id="logout" title="خروج از حساب">خروج ↗</button>
          </div>
        </header>
        <main class="main" id="app" tabindex="-1">
          <div class="loading">در حال آماده‌سازی فضای کار…</div>
        </main>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="/static/dashboard.js" defer></script>
  </body>
</html>
